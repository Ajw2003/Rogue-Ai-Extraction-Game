<!-- @dsCard group="Data" height=140 -->
<div style="display:flex;align-items:center;justify-content:center;height:100%;background:var(--ash,#1E1A14);padding:20px;">
  <div style="width:100%;max-width:220px;display:flex;flex-direction:column;gap:8px;font-family:var(--font-mono, 'Overpass Mono', ui-monospace, monospace);">
    <div style="display:grid;grid-template-columns:56px 1fr 32px;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--vellum-faint,#635C4C);">
      <span>Reach</span>
      <div style="height:3px;background:var(--line,#332D22);"><div style="height:100%;width:68%;background:var(--verdigris,#5FA288);"></div></div>
      <b style="color:var(--vellum-dim,#9A9078);font-weight:400;text-align:right;">68</b>
    </div>
    <div style="display:grid;grid-template-columns:56px 1fr 32px;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--vellum-faint,#635C4C);">
      <span>Heft</span>
      <div style="height:3px;background:var(--line,#332D22);"><div style="height:100%;width:16%;background:var(--orpiment,#C9A227);"></div></div>
      <b style="color:var(--vellum-dim,#9A9078);font-weight:400;text-align:right;">1st</b>
    </div>
    <div style="display:grid;grid-template-columns:56px 1fr 32px;align-items:center;gap:9px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--vellum-faint,#635C4C);">
      <span>Noise</span>
      <div style="height:3px;background:var(--line,#332D22);"><div style="height:100%;width:12%;background:var(--madder,#C4542E);"></div></div>
      <b style="color:var(--vellum-dim,#9A9078);font-weight:400;text-align:right;">none</b>
    </div>
  </div>
</div>

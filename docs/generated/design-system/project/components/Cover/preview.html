<!-- @dsCard height=320 -->
<div style="width:100%;height:100%;background:var(--bone-black,#14120E);">
<svg viewBox="0 0 960 320" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plunderspell cover: a hairline-gridded band of verdigris, orpiment, lapis and madder, with the wordmark below">
<!--
  blocks: ash(space-3) verdigris(largest, the accent) orpiment(gold/value) lapis(the voice) madder(alarm sliver) -- identity weight, not UI frequency
  arrangement: a strip of unequal bands across the top, radius-none throughout
  pattern: the 1px hairline grid every card in the system uses (.grid/.plates/.pigments/.strata) -- gaps cut from the ground colour between blocks, in place of a border-radius/shadow language
  scales: space-hairline (1px gaps), radius-none (every corner square)
-->
<style>
  .gd{ fill: var(--bone-black,#14120E); }
  .b-ash{ fill: var(--ash,#1E1A14); }
  .b-verdigris{ fill: var(--verdigris,#5FA288); }
  .b-orpiment{ fill: var(--orpiment,#C9A227); }
  .b-lapis{ fill: var(--lapis,#7A6AA0); }
  .b-madder{ fill: var(--madder,#C4542E); }
  .name{ font-family: var(--font-display,'Eczar',Georgia,'Times New Roman',serif); font-weight:800; fill: var(--vellum,#DCD2BA); }
  .tag{ font-family: var(--font-mono,'Overpass Mono',ui-monospace,monospace); fill: var(--vellum-faint,#635C4C); letter-spacing: .18em; text-transform: uppercase; }
</style>

<rect class="gd" x="0" y="0" width="960" height="320"/>

<!-- top band: hairline-gridded blocks, 1px gaps cut from the ground -->
<rect class="gd" x="0" y="0" width="960" height="108"/>
<rect class="b-ash" x="1" y="1" width="139" height="106"/>
<rect class="b-verdigris" x="141" y="1" width="378" height="106"/>
<rect class="b-orpiment" x="520" y="1" width="238" height="106"/>
<rect class="b-lapis" x="759" y="1" width="139" height="106"/>
<rect class="b-madder" x="899" y="1" width="60" height="106"/>

<!-- name -->
<text class="name" x="32" y="185" font-size="64">Plunderspell</text>
<text class="tag" x="32" y="212" font-size="13">A pitch bible in ground pigment</text>
</svg>
</div>
